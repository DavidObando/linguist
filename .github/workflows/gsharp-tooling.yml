name: Gsharp contribution tooling
on:
  push:
    branches: [bootstrap/gsharp-tooling]
  workflow_dispatch:
    inputs:
      ref:
        description: Contribution ref to generate and validate
        default: add/gsharp-language
        required: true
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'add/gsharp-language' }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Fetch native test references and grammar submodules
        run: |
          git fetch https://github.com/github-linguist/linguist.git main:main v2.0.0:v2.0.0 test/attributes:test/attributes test/master:test/master
          git config --global url.https://github.com/.insteadOf git@github.com:
          git submodule init
          git submodule sync --quiet
          script/fast-submodule-update 16
      - name: Generate language ID and register grammar with official tooling
        run: |
          git log -1 --format='Tested source: %H %s'
          script/update-ids
          if ! grep -q 'vendor/grammars/gsharp-tmlanguage' .gitmodules; then
            script/add-grammar https://github.com/DavidObando/gsharp-tmlanguage
          else
            script/grammar-compiler add vendor/grammars/gsharp-tmlanguage
          fi
          test "$(git ls-files --stage vendor/grammars/gsharp-tmlanguage | awk '{print $2}')" = 95997d7e139fdf6f1a9c43f55de31071095ddfe8
          script/update-ids --check
          git add .gitmodules grammars.yml lib/linguist/languages.yml vendor/README.md vendor/licenses vendor/grammars/gsharp-tmlanguage
          mkdir -p contribution-artifacts
          git diff --cached --binary > contribution-artifacts/generated.patch
          git diff --cached --stat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-contribution
          path: contribution-artifacts
      - name: Native tokenizer, samples and classification tests
        run: |
          bundle exec rake samples
          bundle exec ruby -Ilib -Itest -e 'ARGV.each { |file| require_relative file }; ARGV.clear' test/test_heuristics.rb test/test_blob.rb test/test_language.rb test/test_language_id.rb test/test_samples.rb test/test_tokenizer.rb
      - name: Grammar license checks
        if: ${{ !cancelled() }}
        run: bundle exec licensed status -c vendor/licenses/config.yml
      - name: Classifier cross-validation
        if: ${{ !cancelled() }}
        run: bundle exec script/cross-validation --extensions=.gs --test
      - uses: actions/setup-go@v6
        if: ${{ !cancelled() }}
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !cancelled() }}
      - name: Regex data compatibility
        if: ${{ !cancelled() }}
        run: script/check-regex-compatibility
